<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A short session: one belief about one person, set against its alternatives.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>A session · The Other Side</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: one left-aligned reading column, one question per screen. Single pale theme: the session continues from the far side of the main page. */
:root{
  --bg:#E3E6DF; --fg:#121A17; --muted:#59635E; --line:#C6CCC3; --surface:#D6DBD1;
  --accent:#2F4A3A; --accent-ink:#E3E6DF;
  --display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-inline:20px;display:flex;flex-direction:column}
[hidden]{display:none!important}
.wrap{width:100%;max-width:660px;margin-inline:auto;flex:1;display:flex;flex-direction:column;gap:0}

header{padding-block:22px 0;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mark{font-family:var(--display);font-size:1.15rem;font-style:italic;letter-spacing:.005em;color:inherit;text-decoration:none}
.restart{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;padding:4px 0;cursor:pointer}
.restart:hover{color:var(--accent)}
.prog{height:1px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:-0.5px;height:2px;background:var(--accent);width:0;transition:width .5s ease}
.recap{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:1.2em}

main{flex:1;padding-block:clamp(28px,7vh,72px) 48px;display:flex;flex-direction:column;gap:22px;min-width:0}
main.in{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pre{font-family:var(--display);font-size:1.2rem;line-height:1.4;color:var(--muted);max-width:34em}
.pre strong{color:var(--fg);font-weight:500}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.65rem,4.6vw,2.35rem);line-height:1.14;
  letter-spacing:-.01em;margin:0;text-wrap:balance;max-width:20em}
.sub{color:var(--muted);margin:0;max-width:36em}
.note{color:var(--muted);font-size:.86rem;margin:0;max-width:38em}
.note a{color:var(--accent)}

.opts{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:6px}
.opt{display:flex;gap:16px;align-items:baseline;text-align:left;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 8px 14px 4px;font:inherit;font-size:1.02rem;color:var(--fg);cursor:pointer;
  transition:background .15s ease,padding-left .15s ease}
.opt .k{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:1.2em;flex:none}
.opt .t{min-width:0}
.opt .n{display:block;font-size:.82rem;color:var(--muted)}
.opt:hover:not(:disabled){background:var(--surface);padding-left:10px}
.opt:hover:not(:disabled) .k{color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--surface);padding-left:10px}
.opt[aria-pressed="true"] .k{color:var(--accent);font-weight:500}
.opt[aria-pressed="true"] .t{font-weight:500}
.opt:disabled{cursor:default}
.opt:disabled:not([aria-pressed="true"]){color:var(--muted)}
.done .opt:not([aria-pressed="true"]){opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.reply{display:flex;flex-direction:column;gap:18px;animation:rise .35s ease both}
.reply p{font-family:var(--display);font-size:1.3rem;line-height:1.35;margin:0;max-width:30em}
.reply p.small{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.go{align-self:flex-start;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:2px;padding:12px 18px;cursor:pointer}
.go:disabled{background:var(--line);color:var(--muted);cursor:default}
.go span{opacity:.7;margin-left:10px}

/* rating rows */
.rate{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px 20px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.rrow .nm{min-width:0}
.rrow .lv{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;min-height:1.3em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{height:30px;background:none;border:1px solid var(--line);border-radius:2px;cursor:pointer;padding:0}
.scale button:hover{border-color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  width:190px;margin-left:auto;padding-right:4px}
@media (max-width:520px){ .rrow{grid-template-columns:1fr} .ends{width:100%} }

/* predictions and findings lists */
.preds,.card{display:flex;flex-direction:column;margin:0}
.preds{border-top:1px solid var(--line)}
.card{border-top:1px solid var(--fg)}
.preds div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 16px;padding:11px 4px;border-bottom:1px solid var(--line)}
.card div{display:grid;grid-template-columns:11em minmax(0,1fr);gap:4px 16px;padding:13px 4px;border-bottom:1px solid var(--line)}
.preds dt,.card dt{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:.25em}
.preds dd{margin:0}
.preds .mine dt{color:var(--accent)}
.card dd{margin:0;font-family:var(--display);font-size:1.15rem;line-height:1.35}
.card dd em{font-style:normal;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:8px;white-space:nowrap}
@media (max-width:520px){ .preds div,.card div{grid-template-columns:1fr} }

/* fit table */
.fitwrap{overflow-x:auto}
.fit{border-collapse:collapse;width:100%;font-size:.95rem}
.fit th,.fit td{padding:11px 6px;border-bottom:1px solid var(--line);text-align:center}
.fit thead th{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;vertical-align:bottom}
.fit th[scope="row"]{text-align:left;font-weight:400;padding-left:4px}
.fit tr.read th[scope="row"]{font-weight:500}
.fit td{font-family:var(--mono);color:var(--muted)}
.fit td.f{color:var(--accent);font-weight:500}
.fit td.l{color:var(--fg)}
.legend{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}

/* gauge */
.gauge{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.g-row{display:grid;grid-template-columns:8.5em minmax(0,1fr) 9.5em;gap:14px;align-items:center}
.g-name{font-size:.9rem;min-width:0}
.g-name b{font-weight:500}
.g-name small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.g-track{position:relative;height:18px;margin-inline:6px}
.g-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.g-track s{position:absolute;top:5px;width:1px;height:8px;background:var(--line)}
.g-ghost,.g-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%)}
.g-ghost{border:1px solid var(--muted);background:var(--bg)}
.g-dot{background:var(--fg);transition:left .9s cubic-bezier(.2,.7,.2,1)}
.g-row.read .g-dot{background:var(--accent)}
.g-val{font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right}
.g-val.moved{color:var(--fg)}
@media (max-width:520px){ .g-row{grid-template-columns:6.4em minmax(0,1fr)} .g-val{display:none} }

footer{padding-block:14px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <a class="mark" href="../">The Other Side</a>
      <button class="restart" id="restart" type="button" hidden>Start over</button>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="recap" id="recap"></div>
  </header>
  <main id="stage"></main>
  <footer><span>Prototype · the relationship door</span><span>Your answers stay in this tab · Nothing is sent or saved</span></footer>
</div>

<script>
(function(){
"use strict";
var stage=document.getElementById("stage"), prog=document.getElementById("prog"),
    recap=document.getElementById("recap"), restartBtn=document.getElementById("restart");
var LETTERS="ABCDEFGHIJ";
var LEVELS=["","Almost impossible","Unlikely","Plausible","Likely","Almost certainly"];
var NUM=["no","one","two","three","four","five","six"];

/* us: the explanation is about the two of you (or about you). painful: hard to have confirmed. */
var M={
  lose:{s:"They're losing interest.",n:"Losing interest",us:1,painful:1,
        pred:"You start most contact. Replies get shorter. Little is offered back.",
        cond:"I start every contact and nothing comes back"},
  over:{s:"They're overwhelmed.",n:"Overwhelmed",us:0,
        pred:"It is the same with most people, outside a few fixed commitments. Contact is thin but not cold.",
        cond:"It's the same with everyone in their life"},
  prio:{s:"They want this, but don't prioritize it.",n:"Not a priority",us:1,painful:1,
        pred:"They turn up for other people. You get what is left over, and changes come late.",
        cond:"Other people still get their time"},
  avoid:{s:"They're avoiding telling me something.",n:"Avoiding something",us:1,painful:1,
        pred:"Fine in a group or by message. It is time alone with you that falls through.",
        cond:"It's easier for them when other people are there"},
  upset:{s:"They're upset with me.",n:"Upset with me",us:1,painful:1,
        pred:"Cool with you, normal with others. It began at a point you could name."},
  mine:{s:"My expectations changed, not their behavior.",n:"My expectations",us:1,
        pred:"Their behavior is close to what it was. You are the one reaching more.",
        cond:"I'm reaching out more than I used to"}
};
var IDS=["lose","over","prio","avoid","upset","mine"];

var CHAIN={
  real:"The change is in them, not in what I expect.",
  choice:"It's a choice they are making.",
  us:"It's about the two of us, not about their life.",
  feel:"What they do shows what they feel.",
  enough:"I know enough to tell these explanations apart.",
  mem:"I remember accurately how things used to be."
};
var CHAIN_SHOWN=["real","choice","us","feel","enough"];
/* what has to be true for each read, and what it says is not true */
var NEEDS={lose:["real","us","feel"],over:["real"],prio:["real","choice","us"],avoid:["real","choice"],upset:["real","us"],mine:[]};
var DENIES={over:"us",mine:"real"};

/* this tool's assumptions about what each reported observation fits: 1 fits, -1 fits less well, absent = doesn't separate */
var QS=["q1","q2","q3","q4"];
var Q={
  q1:{q:"After a lapse, who makes the next move?",col:"Next move",
      o:[["me","Always me"],["them","Sometimes them"],["dk","I don't know"]],
      fit:{me:{lose:1,prio:1,upset:1,mine:1},them:{lose:-1,mine:1}},
      fact:{me:"you make every next move",them:"they sometimes make the next move"},
      say:{me:"That fits losing interest. It also fits not being a priority, and someone with nothing left to give. On its own it separates very little.",
           them:"Losing interest fits that less well. It is closer to what you would see if their behavior had not changed much.",
           dk:"Unknown. This would have helped separate losing interest from the rest."},
      unk:"who makes the next move"},
  q2:{q:"Is it the same with other people in their life?",col:"With others",
      o:[["all","Yes, with everyone"],["others","No, other people still get their time"],["dk","I don't know"]],
      fit:{all:{over:1,lose:-1,prio:-1,avoid:-1,upset:-1},others:{over:-1,prio:1,lose:1,avoid:1,upset:1}},
      fact:{all:"it is the same with everyone in their life",others:"other people still get their time"},
      say:{all:"Then it is not specific to you. Overwhelmed fits. The explanations about the two of you fit less well.",
           others:"Then it is not the same across the board. Overwhelmed fits less well, though people under strain do keep some commitments and drop others.",
           dk:"Unknown. This is the fact that best separates overwhelmed from the explanations about the two of you."},
      unk:"whether it is the same with other people"},
  q3:{q:"Is it different when other people are around?",col:"In company",
      o:[["group","Yes, it's easier in a group"],["same","No, it's the same either way"],["dk","I don't know"]],
      fit:{group:{avoid:1,prio:1},same:{avoid:-1}},
      fact:{group:"it is easier when other people are there",same:"it is the same alone or in company"},
      say:{group:"That fits avoiding time alone with you. It doesn't rule out waning interest; low-cost contact is often what lasts longest.",
           same:"Then there is nothing particular about time alone. Avoidance fits less well.",
           dk:"Unknown. This is the fact that would point to avoidance."},
      unk:"whether it is different in company"},
  q4:{q:"Are you reaching out more than you used to?",col:"Your reach",
      o:[["yes","Yes"],["no","No"],["dk","I don't know"]],
      fit:{yes:{mine:1},no:{mine:-1}},
      fact:{yes:"you are reaching out more than you used to",no:"you are reaching out no more than you used to"},
      say:{yes:"Then your reach has grown. That can be a cause of the gap or a response to it. This answer doesn't say which.",
           no:"Then your side hasn't changed much. “My expectations changed” fits less well.",
           dk:"Unknown. Without a baseline it is hard to say who changed."},
      unk:"whether you are reaching out more than you used to"}
};
var COND_MET={lose:["q1","me"],over:["q2","all"],prio:["q2","others"],avoid:["q3","group"],mine:["q4","yes"]};

var S;
function reset(){ S={know:{},base:{},after:{},marked:[],notes:[]}; recap.textContent=""; restartBtn.hidden=true; who(); }
restartBtn.addEventListener("click",reset);

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function pct(v){return (Math.max(1,Math.min(5,v))-1)/4*100}
function setProg(p){prog.style.width=(p*100)+"%"}
function show(html){stage.classList.remove("in");stage.innerHTML=html;void stage.offsetWidth;stage.classList.add("in");window.scrollTo(0,0)}
function setRecap(){var a=[];if(S.whoR)a.push(S.whoR);if(S.whatR)a.push(S.whatR);if(S.countR)a.push(S.countR);recap.textContent=a.join("  ·  ")}
function fitOf(k,id){var a=S.know[k];if(!a||a==="dk")return null;return (Q[k].fit[a]||{})[id]||0}
function saysDoes(){return S.whatR==="Says one thing, does another"}

var keyHandler=null;
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(keyHandler)keyHandler(e);
});

function head(o){
  return (o.kicker?'<div class="kicker">'+esc(o.kicker)+'</div>':'')+
         (o.pre?'<div class="pre">'+o.pre+'</div>':'')+
         '<h1>'+esc(o.q)+'</h1>'+(o.sub?'<p class="sub">'+esc(o.sub)+'</p>':'');
}
function contBtn(label){return '<button class="go" type="button">'+(label||"Continue")+'<span>↵</span></button>'}
function wireGo(next){
  var b=stage.querySelector(".go");
  b.addEventListener("click",function(){keyHandler=null;next()});
  keyHandler=function(e){if(e.key==="Enter"&&!b.disabled){e.preventDefault();b.click()}};
  return b;
}
function animateGauge(root){
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    root.querySelectorAll(".g-dot[data-to]").forEach(function(d){d.style.left=d.getAttribute("data-to")+"%"});
  })});
}
function addReply(html,next){
  var r=document.createElement("div");r.className="reply";r.innerHTML=html+contBtn();
  stage.appendChild(r);
  var b=r.querySelector(".go");b.addEventListener("click",function(){keyHandler=null;next()});
  keyHandler=function(e){if(e.key==="Enter"){e.preventDefault();b.click()}};
  r.scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* single-choice screen */
function ask(o){
  if(o.p!=null)setProg(o.p);
  var h=head(o)+'<div class="opts">';
  var k=0;
  o.options.forEach(function(op,i){
    var dis=op.off?' disabled':'';
    var key=op.off?"":LETTERS[k++];
    h+='<button class="opt" type="button" data-i="'+i+'" data-k="'+key+'" aria-pressed="false"'+dis+'><span class="k">'+key+'</span><span class="t">'+esc(op.l)+(op.note?'<span class="n">'+esc(op.note)+'</span>':'')+'</span></button>';
  });
  h+='</div>'+(o.foot?'<p class="note">'+o.foot+'</p>':'');
  show(h);
  var box=stage.querySelector(".opts"), btns=[].slice.call(box.querySelectorAll(".opt"));
  function pick(b){
    if(box.classList.contains("done"))return;
    var op=o.options[+b.getAttribute("data-i")];
    b.setAttribute("aria-pressed","true");box.classList.add("done");
    btns.forEach(function(x){x.disabled=true});
    keyHandler=null;
    var rep=o.respond?o.respond(op.v):null;
    if(rep){addReply(rep,function(){o.next(op.v)})}
    else setTimeout(function(){o.next(op.v)},220);
  }
  btns.forEach(function(b){b.addEventListener("click",function(){pick(b)})});
  keyHandler=function(e){
    var key=e.key.toUpperCase();
    var b=btns.filter(function(x){return x.getAttribute("data-k")===key&&!x.disabled})[0];
    if(b){e.preventDefault();pick(b)}
  };
}

/* a screen of five-step scales; pre holds starting values, was shows what they were */
function rateScreen(o){
  setProg(o.p);
  var h=head(o)+'<div class="ends"><span>Impossible</span><span>Certain</span></div><div class="rate">';
  o.ids.forEach(function(id){
    h+='<div class="rrow" data-id="'+id+'"><div class="nm">'+esc(M[id].s)+'<span class="lv"></span></div><div class="scale" role="group" aria-label="'+esc(M[id].n)+'">';
    for(var i=1;i<=5;i++)h+='<button type="button" data-v="'+i+'" aria-pressed="false" aria-label="'+LEVELS[i]+'"></button>';
    h+='</div></div>';
  });
  h+='</div>'+contBtn();
  show(h);
  var go=stage.querySelector(".go"), got={};
  function label(row,id){
    var t=LEVELS[got[id]]||"";
    if(o.was&&got[id]&&o.was[id]!==got[id])t+=" · was "+LEVELS[o.was[id]];
    row.querySelector(".lv").textContent=t;
  }
  stage.querySelectorAll(".rrow").forEach(function(row){
    var id=row.getAttribute("data-id"), bs=[].slice.call(row.querySelectorAll(".scale button"));
    function set(v){got[id]=v;bs.forEach(function(x){x.setAttribute("aria-pressed",+x.getAttribute("data-v")===v?"true":"false")});label(row,id);
      go.disabled=Object.keys(got).length<o.ids.length;}
    bs.forEach(function(b){b.addEventListener("click",function(){set(+b.getAttribute("data-v"))})});
    if(o.pre&&o.pre[id])set(o.pre[id]);
  });
  go.disabled=Object.keys(got).length<o.ids.length;
  go.addEventListener("click",function(){keyHandler=null;o.next(got)});
  keyHandler=function(e){if(e.key==="Enter"&&!go.disabled){e.preventDefault();go.click()}};
}

/* ---------- screens ---------- */
function who(){
  ask({p:0,kicker:"Why a relationship changed",q:"Think of one person. Not a type. Who are they to you?",
    sub:"That it happened is not in question here. Why it happened is.",
    options:[{v:"Friend",l:"A friend"},{v:"Partner",l:"A partner"},{v:"Family",l:"Family"},{v:"Colleague",l:"Someone I work with"},{v:"Drifted",l:"Someone I've drifted from"}],
    foot:'This tests a read about distance. If you are afraid of this person, or of how they would take a question, it is the wrong instrument. <a href="https://findahelpline.com" target="_blank" rel="noopener">Find someone to talk to</a>.',
    next:function(v){S.whoR=v;restartBtn.hidden=false;setRecap();what()}});
}
function what(){
  ask({p:.06,kicker:"Anchor",q:"What would you point to?",
    options:[{v:"Cancels plans",l:"They cancel plans"},{v:"Gone quiet",l:"They've gone quiet"},{v:"Says one thing, does another",l:"They say one thing and do another"},{v:"Stopped asking",l:"They stopped asking about my life"}],
    next:function(v){S.whatR=v;setRecap();count()}});
}
function count(){
  ask({p:.1,kicker:"Anchor",q:"How many times?",
    options:[{v:"1–2 times",l:"Once or twice"},{v:"3–5 times",l:"Three to five"},{v:"5+ times",l:"More than five"},{v:"Uncounted",l:"I haven't counted"}],
    respond:function(v){
      if(v==="1–2 times")return "<p>Two is a thin sample. Keep that in mind when you rate your confidence.</p>";
      if(v==="Uncounted")return "<p>Then the number isn't what you are going on. We'll find what is.</p>";
      return null;},
    next:function(v){S.countR=v;setRecap();read()}});
}
function read(){
  var ops=IDS.map(function(id){return {v:id,l:M[id].s}});
  ops.push({v:"other",l:"Something else, or more than one of these."});
  ops.push({v:"dk",l:"I don't know."});
  ask({p:.14,kicker:"Your read",q:"And your read?",options:ops,
    respond:function(v){
      if(v==="dk")return "<p>Fair. Then there is no read to test. We can still see what your answers separate.</p>";
      if(v==="other")return "<p>Then this list may not hold your explanation, and more than one can be true at once. We can still see what your answers separate.</p>";
      return null;},
    next:function(v){
      if(v==="dk"||v==="other"){S.read=null;rate();return}
      S.read=v;conf()}});
}
function conf(){
  ask({p:.18,kicker:"Your read",pre:"<strong>"+esc(M[S.read].s)+"</strong>",q:"How sure are you?",
    options:[{v:5,l:"Almost certainly"},{v:4,l:"Likely"},{v:3,l:"Plausible"},{v:2,l:"It's a guess"}],
    next:function(v){S.conf=v;S.confL=v===2?"A guess":LEVELS[v];S.base[S.read]=v;rate()}});
}
function rate(){
  var ids=IDS.filter(function(id){return id!==S.read});
  rateScreen({p:.23,kicker:"What else could explain this",q:S.read?"Rate the other "+NUM[ids.length]+".":"Rate all "+NUM[ids.length]+".",
    sub:"From almost impossible to almost certainly. More than one can be true.",ids:ids,
    next:function(got){ids.forEach(function(id){S.base[id]=got[id]});story()}});
}

function story(){
  var hi=IDS.filter(function(id){return S.base[id]>=4}), thr=" Likely or higher";
  if(!hi.length){var mx=Math.max.apply(null,IDS.map(function(id){return S.base[id]}));hi=IDS.filter(function(id){return S.base[id]===mx});thr=" highest"}
  var n=hi.length, inIt=hi.filter(function(id){return M[id].us}).length;
  var first, q;
  if(inIt===n){first=n===1?"The explanation you rate"+thr+" is about the two of you.":"The "+NUM[n]+" explanations you rate"+thr+" are all about the two of you.";q="What tells you it is about the two of you?"}
  else if(inIt===0){first=n===1?"The explanation you rate"+thr+" doesn't involve you.":"None of the explanations you rate"+thr+" involves you.";q="What tells you that?"}
  else {first="Of the "+NUM[n]+" explanations you rate"+thr+", "+NUM[inIt]+(inIt===1?" is":" are")+" about the two of you.";q="What tells you which it is?"}
  var central=inIt>0;
  var ops=central?
    [{v:"only",l:"It happens only with me"},{v:"after",l:"It started after something between us"},{v:"told",l:"They told me"},{v:"none",l:"Nothing specific. It's my reading."}]:
    [{v:"all",l:"It's the same with everyone"},{v:"life",l:"It started with something in their life"},{v:"told",l:"They told me"},{v:"none",l:"Nothing specific. It's my reading."}];
  ask({p:.29,kicker:"Your place in the story",pre:"<strong>"+first+"</strong>",q:q,options:ops,
    respond:function(v){
      if(v==="only"||v==="all")return "<p>That would be real evidence. We'll come back to whether you know it.</p>";
      if(v==="after"||v==="life")return "<p>A date is something that can be checked.</p>";
      if(v==="told")return saysDoes()?"<p>Then you have their account. Whether it matches what they do is the thing you came in with.</p>":"<p>Then you have their account of it.</p>";
      return "<p>Then your place in this story is an assumption. It may still be right.</p>";},
    next:function(v){S.storyEv=v;if(S.read)chain();else know(0)}});
}

function chain(){
  setProg(.35);
  var h=head({kicker:"Assumptions",pre:"<strong>"+esc(M[S.read].s)+"</strong>",q:"Which of these are you assuming?",sub:"Mark every one that applies."})+'<div class="opts">';
  CHAIN_SHOWN.forEach(function(k,i){h+='<button class="opt" type="button" data-c="'+k+'" data-k="'+LETTERS[i]+'" aria-pressed="false"><span class="k">'+LETTERS[i]+'</span><span class="t">'+esc(CHAIN[k])+'</span></button>'});
  h+='</div>'+contBtn();
  show(h);
  var btns=[].slice.call(stage.querySelectorAll(".opt")), go=stage.querySelector(".go");
  btns.forEach(function(b){b.addEventListener("click",function(){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true")})});
  go.addEventListener("click",function(){
    keyHandler=null;
    S.marked=btns.filter(function(b){return b.getAttribute("aria-pressed")==="true"}).map(function(b){return b.getAttribute("data-c")});
    chainBack();
  });
  keyHandler=function(e){
    if(e.key==="Enter"){e.preventDefault();go.click();return}
    var b=btns.filter(function(x){return x.getAttribute("data-k")===e.key.toUpperCase()})[0];
    if(b){e.preventDefault();b.click()}
  };
}
function chainBack(){
  var need=NEEDS[S.read], has=function(k){return S.marked.indexOf(k)>-1};
  var hit=need.filter(has), miss=need.filter(function(k){return !has(k)});
  var pre;
  if(!need.length)pre="<strong>Your read needs none of these to be true.</strong> It says the change is in what you expect.";
  else if(!miss.length)pre="<strong>Your read needs "+NUM[need.length]+" of these to be true. You marked "+(need.length===1?"it":"all of them")+".</strong>";
  else pre="<strong>Your read needs "+NUM[need.length]+" of these to be true. You marked "+(hit.length?NUM[hit.length]:"none")+".</strong><br>Unmarked: "+miss.map(function(k){return esc(CHAIN[k].replace(/\.$/,""))}).join("; ")+".";
  var deny=DENIES[S.read];
  if(deny&&has(deny)){pre+="<br>You also marked “"+esc(CHAIN[deny].replace(/\.$/,""))+".” Your read says the opposite.";S.notes.push("You marked an assumption your own read denies.")}
  if(!has("enough"))pre+="<br>You left “I know enough to tell these apart” unmarked. The rest of this session tests that.";
  var opts=need.length?need:["mem"];
  if(opts.length===1){S.work=opts[0];
    show(head({kicker:"Assumptions",pre:pre,q:"One assumption carries the most weight."})+'<p class="sub">'+esc(CHAIN[S.work])+'</p>'+contBtn());setProg(.4);
    wireGo(findable);return;}
  ask({p:.4,kicker:"Assumptions",pre:pre,q:"Which one is doing the most work?",
    options:opts.map(function(k){return {v:k,l:CHAIN[k]}}),
    next:function(v){S.work=v;findable()}});
}
function findable(){
  ask({p:.44,kicker:"Assumptions",pre:"<strong>"+esc(CHAIN[S.work])+"</strong>",q:"Could you find that out?",
    options:[{v:"ask",l:"By asking them one question"},{v:"watch",l:"By watching for a few weeks"},{v:"hard",l:"I could ask, but I wouldn't get a straight answer"},{v:"no",l:"It can't be known"}],
    respond:function(v){
      if(v==="no")return "<p>Then something unknowable is doing the most work. Your confidence should carry that.</p>";
      if(v==="hard")return "<p>Then asking is not a cheap test here. That is worth knowing in itself.</p>";
      return null;},
    next:function(v){S.findable=v;if(v==="no"||v==="hard"){S.asked="na";carry()}else asked()}});
}
function asked(){
  ask({p:.48,kicker:"Assumptions",q:"Have you?",
    options:[{v:"yes",l:"Yes"},{v:"no",l:"No"},{v:"half",l:"Not directly"}],
    respond:function(v){
      if(v==="yes")return saysDoes()?"<p>Then you have their account. Whether it matches what they do is the thing you came in with.</p>":"<p>Then you have their answer. Keep what they said separate from what you concluded.</p>";
      if(S.findable==="ask")return "<p>The assumption your read leans on most is one question away. It is still unasked. That is usually about the answer, not the question.</p>";
      return "<p>It would take a few weeks to see. Until then this part is a guess. Watching is slower than asking and easier to misread.</p>";},
    next:function(v){S.asked=v;carry()}});
}

function carry(){
  ask({p:.52,kicker:"Evidence",q:"What is carrying your confidence?",
    options:[{v:"count",l:"The number of times"},{v:"how",l:"How they do it"},{v:"me",l:"That I'm always the one who reaches out"},{v:"life",l:"Something I know about their life"},{v:"feel",l:"A feeling"}],
    respond:function(v){
      if(v==="count")return "<p>How often it happens tells you it is a pattern. It doesn't tell you which pattern: the same count is compatible with every explanation here.</p>";
      if(v==="how")return "<p>That can separate them. A late excuse and a worn-out apology point different ways. It is usable evidence, if you can say which you saw.</p>";
      if(v==="me")return "<p>That fits losing interest. It also fits not being a priority, and someone with nothing left to give. It separates less than it feels like it does.</p>";
      if(v==="life")return "<p>That is direct evidence, if it is something you know and not something you have assumed.</p>";
      return "<p>A feeling is a summary of evidence you haven't itemized. It may be right. It can't be checked until you unpack it.</p>";},
    next:function(v){S.carry=v;predict()}});
}

function predict(){
  var h='<dl class="preds">';
  IDS.forEach(function(id){h+='<div'+(id===S.read?' class="mine"':'')+'><dt>'+esc(M[id].n)+'</dt><dd>'+esc(M[id].pred)+'</dd></div>'});
  h+='</dl>';
  /* only offer conditions that would count against the read */
  var ops=IDS.filter(function(id){
    if(id===S.read||!COND_MET[id])return false;
    var c=COND_MET[id];return ((Q[c[0]].fit[c[1]]||{})[S.read]||0)<=0;
  }).map(function(id){return {v:id,l:M[id].cond}});
  ops.push({v:"none",l:"None of these would move me"});
  ask({p:.57,kicker:"What each explanation predicts",pre:"If each were true, this is roughly what you would expect to see. These are this tool's assumptions, not facts about this person."+h,
    q:"Which of these, if you saw it, would move you off your read?",options:ops,
    respond:function(v){return v==="none"?"<p>Noted. Then nothing on this list could test your read.</p>":null},
    next:function(v){S.cond=v;know(0)}});
}

function know(i){
  if(i>=QS.length){due();return}
  var key=QS[i], q=Q[key];
  ask({p:.62+i*.04,kicker:"Do you know that?",q:q.q,options:q.o.map(function(o){return {v:o[0],l:o[1]}}),
    respond:function(v){
      S.know[key]=v;
      var extra="";
      var bears=S.read&&Object.keys(q.fit).some(function(a){return q.fit[a][S.read]});
      if(v==="dk"&&bears&&S.conf>=4&&!S.dkSaid){S.dkSaid=1;extra+="<p class=\"small\">You rated your read "+S.confL+" without it.</p>"}
      if(key==="q1"&&S.carry==="me"&&v==="them"){extra+="<p class=\"small\">Earlier you said you are always the one who reaches out. That was carrying your confidence.</p>";S.notes.push("What you said was carrying your confidence didn't match a later answer.")}
      if(key==="q2"){
        if(S.storyEv==="only"&&v!=="others"){extra+="<p class=\"small\">Earlier you said it happens only with you.</p>";S.notes.push("You said it happens only with you, then didn't confirm it.")}
        if(S.storyEv==="all"&&v!=="all"){extra+="<p class=\"small\">Earlier you said it's the same with everyone.</p>";S.notes.push("You said it is the same with everyone, then didn't confirm it.")}
      }
      return "<p>"+q.say[v]+"</p>"+extra;},
    next:function(){know(i+1)}});
}

function condState(){
  if(!S.cond||S.cond==="none")return "none";
  var c=COND_MET[S.cond], a=S.know[c[0]];
  return a===c[1]?"met":(a==="dk"?"unknown":"unmet");
}
function due(){
  if(!S.read){fitScreen();return}
  if(condState()!=="met"){oppose();return}
  ask({p:.8,kicker:"Your condition",pre:"You said this would move you off your read:<br><strong>"+esc(M[S.cond].cond)+".</strong><br>By your own account, it's true.",
    q:"Does it?",options:[{v:"yes",l:"Yes"},{v:"no",l:"No"},{v:"less",l:"It counts for less than I said"}],
    next:function(v){S.due=v;oppose()}});
}

/* the opposing case: specific to the read */
function oppose(){
  if(S.read==="lose"){foundation();return}
  var ops=IDS.filter(function(id){return id!==S.read}).map(function(id){return {v:id,l:M[id].s}});
  ops.push({v:"none",l:"None of them."});
  ask({p:.83,kicker:"The other side",q:"Which rival is hardest to dismiss?",options:ops,
    next:function(v){S.hard=v;fitScreen()}});
}
function foundation(){
  ask({p:.83,kicker:"The other side",q:"Build the strongest case that this relationship matters to them as much as it ever did.",sub:"Choose its foundation. Only pick what is true.",
    options:[{v:"say",l:"They keep saying they want to see me, and they don't have to."},
             {v:"together",l:"When we are together, nothing is different."},
             {v:"everyone",l:"They've been like this with everyone lately."},
             {v:"counted",l:"They have shown up when it counted."},
             {v:"none",l:"I can't build it from these."}],
    respond:function(v){
      if(v==="none")return "<p>Then none of these is available to you. That counts. It is an absence of counter-evidence, not proof.</p>";
      if(v==="everyone"&&S.know.q2==="others")return "<p>A few answers ago you said other people still get their time. Both can't be true, so the case can't stand on this.</p>";
      if(v==="everyone"&&S.know.q2==="dk")return "<p>A few answers ago you didn't know whether it was the same with other people. The case now rests on it.</p>";
      return null;},
    next:function(v){
      S.found=v;
      if(v==="everyone"&&S.know.q2==="others"){S.found="conflict";S.notes.push("You built the opposing case on something you had already said was not true.");fitScreen();return}
      if(v==="everyone"&&S.know.q2==="dk")S.notes.push("The opposing case you built rests on a fact you said you didn't know.");
      /* when the complaint is that words and actions don't match, don't ask them to argue the words */
      if(v==="none"||saysDoes())fitScreen();else defend()}});
}
function defend(){
  ask({p:.86,kicker:"The other side",pre:"Your original read answers it:<br><strong>“They're losing interest. Words are cheap. Look at what they do.”</strong>",
    q:"Does any response hold?",
    options:[{v:"a",l:"I've been counting the misses, not the times they came through."},
             {v:"b",l:"They keep saying it, and saying it costs them something too."},
             {v:"none",l:"No. My read stands."}],
    next:function(v){S.defend=v;fitScreen()}});
}

function fitScreen(){
  setProg(.9);
  var order=(S.read?[S.read]:[]).concat(IDS.filter(function(id){return id!==S.read}));
  var h='<div class="kicker">What your answers fit</div><h1>Here is how the four things you reported sit against each explanation.</h1>'+
    '<div class="fitwrap"><table class="fit"><thead><tr><th scope="col"></th>'+QS.map(function(k){return '<th scope="col">'+Q[k].col+'</th>'}).join("")+'</tr></thead><tbody>';
  order.forEach(function(id){
    h+='<tr'+(id===S.read?' class="read"':'')+'><th scope="row">'+esc(M[id].n)+'</th>';
    QS.forEach(function(k){var f=fitOf(k,id);
      h+=f===null?'<td aria-label="unknown">?</td>':f>0?'<td class="f" aria-label="fits">●</td>':f<0?'<td class="l" aria-label="fits less well">○</td>':'<td aria-label="does not separate">·</td>'});
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="legend"><span>● fits</span><span>○ fits less well</span><span>· doesn\'t separate</span><span>? you don\'t know</span></div>'+
    '<p class="note">These marks are this tool\'s assumptions about what each explanation predicts, applied to what you reported from memory. They are not facts about this person, and more than one explanation can be true.</p>'+contBtn();
  show(h);wireGo(rerate);
}
function rerate(){
  var order=(S.read?[S.read]:[]).concat(IDS.filter(function(id){return id!==S.read}));
  rateScreen({p:.93,kicker:"Second rating",q:"Having seen that, rate all "+NUM[order.length]+" again.",sub:"Your first ratings are filled in. Change only what you would now change.",
    ids:order,pre:S.base,was:S.base,next:function(got){S.after=got;findings()}});
}

function gauge(){
  var order=(S.read?[S.read]:[]).concat(IDS.filter(function(id){return id!==S.read}));
  var h='<div class="gauge" aria-label="Your first and second ratings">';
  order.forEach(function(id){
    var moved=S.after[id]!==S.base[id];
    h+='<div class="g-row'+(id===S.read?' read':'')+'"><div class="g-name">'+(id===S.read?'<small>Your read</small>':'')+'<b>'+esc(M[id].n)+'</b></div><div class="g-track">';
    for(var i=0;i<5;i++)h+='<s style="left:'+(i*25)+'%"></s>';
    h+='<i class="g-ghost" style="left:'+pct(S.base[id])+'%"></i><i class="g-dot" style="left:'+pct(S.base[id])+'%" data-to="'+pct(S.after[id])+'"></i></div><div class="g-val'+(moved?' moved':'')+'">'+LEVELS[S.after[id]]+'</div></div>';
  });
  return h+'</div>';
}
function names(ids){var a=ids.map(function(id){return "“"+M[id].n+"”"});return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]}

function findings(){
  setProg(.96);
  var a=S.after, b=S.base, r=S.read;
  var mx=Math.max.apply(null,IDS.map(function(id){return a[id]})), tops=IDS.filter(function(id){return a[id]===mx});
  var bmx=Math.max.apply(null,IDS.map(function(id){return b[id]}));
  var dks=QS.filter(function(k){return S.know[k]==="dk"});
  var kind;
  if(!r)kind="noread";
  else if(dks.length>=3)kind="open";
  else if(tops.length===1&&tops[0]===r)kind=a[r]<b[r]?"lower":"held";
  else if(tops.indexOf(r)>-1)kind="level";
  else kind=b[r]<bmx?"inverted":"moved";
  S.kind=kind;
  var h1,lines=[];
  /* what the audit turned up that a held read should carry */
  var weak=[];
  if(S.countR==="1–2 times")weak.push("it has happened once or twice");
  if(S.carry==="feel")weak.push("what carries it is a feeling you haven't itemized");
  if(S.asked==="no"||S.asked==="half")weak.push("the assumption it leans on is unchecked");
  if(S.findable==="no")weak.push("the assumption it leans on can't be known");
  if(S.cond==="none")weak.push("you named nothing that would move you");
  if(S.due==="yes"&&r&&a[r]>=b[r])weak.push("you said your condition was met and moves you, and your rating didn't move");
  if(dks.length)weak.push(NUM[dks.length]+" of the four facts "+(dks.length===1?"is":"are")+" unknown");

  if(kind==="held"){
    h1="Your read held.";
    if(weak.length)lines.push("It is still your leading explanation. It has been tested less than your rating suggests: "+weak.join("; ")+".");
    else lines.push("By your account it is the best-supported explanation here. That is your account, not theirs.");
  }else if(kind==="lower"){
    h1="Your read still leads, lower than you started.";
    if(weak.length)lines.push("Also worth carrying: "+weak.join("; ")+".");
  }else if(kind==="moved"){
    h1="You now rate another explanation above your read.";
    lines.push("Both ratings were yours. What came between them was seeing what your answers fit.");
  }else if(kind==="inverted"){
    h1="You bet on one explanation and rated another higher from the start.";
    lines.push("That was true before any question was asked. The bet and the ratings were never the same view.");
  }else if(kind==="level"){
    h1="Your read is level with "+names(tops.filter(function(id){return id!==r}))+".";
    lines.push("More than one of these can be true at once.");
  }else if(kind==="open"){
    h1="You don't have enough to know yet.";
    lines.push("You answered “I don't know” to "+(dks.length===4?"all four":"three of the four")+" facts that separate these explanations.");
  }else{
    h1="You came in without a read.";
    lines.push(tops.length===1?"After seeing what your answers fit, you rate "+names(tops)+" highest.":"After seeing what your answers fit, "+names(tops)+" are level at the top.");
  }
  if(r)lines.push("You came in saying something changed. Nothing here disputes that. The question was why.");
  if((kind==="held"||kind==="lower")&&M[r].painful)lines.push("Held is not the same as welcome. It rests on your account; the rest is theirs to say.");
  if(tops.indexOf("mine")>-1)lines.push("“My expectations changed” is a description, not a fault.");
  if(S.hard&&S.hard!=="none")lines.push("Hardest rival to dismiss: “"+M[S.hard].n+".” You first rated it "+LEVELS[b[S.hard]]+(a[S.hard]!==b[S.hard]?", then "+LEVELS[a[S.hard]]:"")+".");
  if(S.defend&&S.defend!=="none")lines.push("You could build a case that it still matters to them, from things you say are true.");
  S.notes.forEach(function(n){lines.push(n)});
  if(condState()==="unknown")lines.push("You named what would move you. You don't know whether it is true.");
  if(S.due==="no"||S.due==="less")lines.push("Your condition was met and you "+(S.due==="no"?"did not move":"discounted it")+". That is allowed. It may mean the condition wasn't the real one.");

  var lead=tops[0];
  var fits=QS.filter(function(k){return fitOf(k,lead)>0}).map(function(k){return Q[k].fact[S.know[k]]});
  var changed=IDS.filter(function(id){return a[id]!==b[id]}).map(function(id){return M[id].n+": "+LEVELS[b[id]]+" to "+LEVELS[a[id]]});
  var rows="";
  if(r)rows+='<div><dt>At the start</dt><dd>'+esc(M[r].s)+'<em>'+S.confL+'</em></dd></div>';
  rows+='<div><dt>Now leading</dt><dd>'+tops.map(function(id){return esc(M[id].n)}).join(", ")+'<em>'+LEVELS[mx]+'</em></dd></div>';
  rows+='<div><dt>What you changed</dt><dd>'+(changed.length?esc(changed.join(". "))+".":"Nothing. You rated every one as before.")+'</dd></div>';
  rows+='<div><dt>What fits it, by your account</dt><dd>'+(fits.length?esc(cap(fits.join("; ")))+".":"Nothing you reported separates it from the others.")+'</dd></div>';
  if(r){
    var assume=esc(CHAIN[S.work]);
    if(S.asked==="no"||S.asked==="half")assume+="<em>"+(S.findable==="ask"?"One question away, unasked":"Unobserved")+"</em>";
    else if(S.findable==="hard")assume+="<em>Asking wouldn't settle it</em>";
    else if(S.findable==="no")assume+="<em>Unknowable</em>";
    rows+='<div><dt>Assumption carrying it</dt><dd>'+assume+'</dd></div>';
  }
  rows+='<div><dt>Not yet known</dt><dd>'+(dks.length?esc(cap(dks.map(function(k){return Q[k].unk}).join("; ")))+".":"Nothing on this list. You gave an answer to every one.")+'</dd></div>';

  show('<div class="kicker">What the session found</div><h1>'+esc(h1)+'</h1>'+
    lines.map(function(l){return '<p class="sub">'+esc(l)+'</p>'}).join("")+
    '<dl class="card">'+rows+'</dl>'+gauge()+
    '<p class="note">This is what your answers support. It is not what they think.</p>'+contBtn());
  animateGauge(stage);
  wireGo(forecast);
}

function forecast(){
  ask({p:.98,kicker:"Forecast · optional",pre:"The explanations don't all predict the same thing.",q:"The next time: who makes the move, and does it happen?",
    options:[{v:"I make the move, and it happens",l:"I do, and it happens"},{v:"I make the move, and it falls through",l:"I do, and it falls through"},{v:"They make the move",l:"They do"},{v:"Nobody makes the move",l:"Nobody does"},{v:"",l:"Skip this"}],
    next:function(v){S.forecast=v;view()}});
}
function view(){
  ask({p:.99,kicker:"One last question",q:"Did anything here change your view?",
    options:[{v:"no",l:"No"},{v:"slight",l:"Slightly"},{v:"sig",l:"Significantly"},{v:"wrong",l:"I was wrong"},{v:"expl",l:"My conclusion stayed the same, but my explanation changed"}],
    next:function(v){S.view=v;end()}});
}
function end(){
  setProg(1);
  var dks=QS.filter(function(k){return S.know[k]==="dk"});
  var h1,sub="";
  if(S.findable==="ask"&&(S.asked==="no"||S.asked==="half")){h1="Still open: one question, unasked.";sub="It is cheaper than any forecast.";}
  else if(dks.length){h1="Still open: "+Q[dks[0]].unk+".";}
  else h1="Nothing on this list is still open.";
  var changed=IDS.some(function(id){return S.after[id]!==S.base[id]});
  var mismatch="";
  if(S.view==="no"&&changed)mismatch='<p class="sub">You say nothing changed. Your ratings did. Worth knowing which one you would act on.</p>';
  if((S.view==="sig"||S.view==="wrong")&&!changed)mismatch='<p class="sub">You say your view changed. Your ratings didn\'t. Worth knowing which one you would act on.</p>';
  show('<div class="kicker">Where this leaves it</div><h1>'+esc(h1)+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+mismatch+
    (S.forecast?'<p class="sub">Sealed: '+esc(S.forecast.toLowerCase())+'. In the full product this comes back once, when it happens, and asks what you saw.</p>':'')+
    '<button class="go" type="button">Start again<span>↵</span></button>');
  wireGo(reset);
}

reset();
})();
</script>

</html>
